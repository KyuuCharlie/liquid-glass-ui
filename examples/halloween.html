<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquid Glass · Halloween</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 10%,#5a3470,transparent 42%),radial-gradient(ellipse at 80% 90%,#244c68,transparent 45%),#090d18;color:#f5f2ff;font:16px system-ui;overflow:hidden}.card{width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #ffffff42;border-radius:28px;background:#ffffff12;backdrop-filter:blur(24px) saturate(160%);box-shadow:0 24px 80px #0007,inset 0 1px #ffffff55;text-align:center}.orb{font-size:64px;filter:drop-shadow(0 0 22px #ff9b45aa);animation:float 3s ease-in-out infinite}h1{margin:8px 0;font-size:28px}p{color:#d5cde5;line-height:1.6}button{border:1px solid #ffffff45;border-radius:999px;padding:11px 18px;background:#ffffff18;color:white;cursor:pointer}button:hover{background:#ffffff30}.ghost{position:fixed;font-size:26px;pointer-events:none;animation:rise 2.8s ease-out forwards}@keyframes float{50%{transform:translateY(-10px) rotate(5deg)}}@keyframes rise{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="card"><div class="orb">🎃</div><h1>You've found the hidden glass!</h1><p>A tiny Halloween moment, wrapped in a liquid-glass surface. Tap the pumpkin to release a few friendly ghosts.</p><button id="summon">Summon ghosts 👻</button></main>
<script>document.getElementById('summon').addEventListener('click',()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<7;i++){const g=document.createElement('span');g.className='ghost';g.textContent=['👻','🦇','✨'][i%3];g.style.left=(8+Math.random()*84)+'vw';g.style.bottom='-40px';g.style.animationDelay=(Math.random()*.7)+'s';document.body.append(g);setTimeout(()=>g.remove(),3600)}})</script></body></html>
